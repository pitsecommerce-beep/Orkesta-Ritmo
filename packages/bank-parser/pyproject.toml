[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bank-parser"
version = "0.1.0"
description = "Parser de estados de cuenta bancarios para Orkesta Ritmo - herramienta de preparacion de impuestos en Mexico"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "pdfplumber>=0.10",
    "python-dateutil>=2.8",
    "pytesseract>=0.3.10",
    "pdf2image>=1.16",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["bank_parser"]

[tool.coverage.report]
fail_under = 80
show_missing = true
