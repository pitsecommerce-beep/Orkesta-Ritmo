[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tax-engine"
version = "0.1.0"
description = "Motor de calculo fiscal para Orkesta Ritmo - herramienta de preparacion de impuestos en Mexico"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = [
    "pdfplumber>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["tax_engine"]

[tool.coverage.report]
fail_under = 90
show_missing = true
